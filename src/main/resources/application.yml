
## Springboot config!

########################################################
# SWAGGER DOCS API                                     #
########################################################

#springdoc swagger
springdoc:
  writer-with-default-pretty-printer: true
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    disable-swagger-default-url: true
    enabled: true
  api-docs:
    path: /api-docs
    version: openapi_3_1
    enabled: true
  packagesToScan: com.liberty.demo.presentation.entrypoint.controller

# MicroProfile
mp:
  openapi:
    scan:
      disable: true

spring:
  application:
    name: spring-liberty-producer
  devtools:
    add-properties: false
  security:
    user:
      name: admin
      password: System
      roles: ADMIN, USER
  datasource:
    url: jdbc:h2:mem:booksdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      # default path: h2-console
      path: /h2-ui
      settings.trace: true
      settings.web-allow-others: true
  data:
    redis:
      host: localhost
      password: redispassword
      port: 6379
      ssl:
        enabled: false
      sentinel:
        master: mymaster
        password: redispassword
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
      lettuce:
        shutdown-timeout: 2000ms
      timeout: 2000ms
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 300000

  rabbitmq:
    virtual-host: might_rabbit
    host: localhost
    port: 5672
    username: admin
    password: admin
  cloud:
    stream:
      defaultBinder: rabbit
      instanceCount: 1
      instanceIndex: 0
      bindingRetryInterval: 0
    binders:
      rabbit:
        environment:
          spring:
            rabbitmq:
              host: localhost
              port: 5672
              username: admin
              password: admin

# rabbitmq queue
queue:
  name: might_stream

# rabbitmq exchange
exchange:
  name: might_exchange

# server config
server:
  servlet:
    context-path: /spring-liberty-producer
  port: 9080

# Log settings (INFO, ERROR, DEBUG)
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate: ERROR
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

handlers: java.util.logging.ConsoleHandler.level=INFO
org.junit.platform.launcher.core.EngineDiscoveryOrchestrator.level: WARNING

########################################################
# Show details of health endpoint                      #
########################################################
management:
  endpoints:
    web:
      exposure:
        include: info, health, metrics, prometheus
    base-path: /
    path-mapping:
      health: healthcheck
      prometheus: metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    metrics:
      enabled: false
    prometheus:
      enabled: true
  zipkin:
    tracing:
      endpoint: http://localhost:9411
      sampling:
        probability: 1.0
  health:
    rabbit:
      enabled: true


